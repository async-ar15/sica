description: Write a Python function called 'fibonacci' that returns the nth Fibonacci
  number. Write comprehensive pytest tests.
difficulty: easy
expected_files:
- solution.py
id: fibonacci
max_iterations: 3
test_file: "def test_fibonacci():\n    from solution import fibonacci\n    assert\
  \ fibonacci(0) == 0\n    assert fibonacci(1) == 1\n    assert fibonacci(5) == 5\n"
timeout_seconds: 30

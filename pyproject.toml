[project]
name = "self-improving-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "docker>=7.0",
    "gitpython>=3.1",
    "httpx>=0.27",
    "litellm>=1.40",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "sentence-transformers>=5.7.0",
    "tenacity>=8.0",
    "typer>=0.12",
]

[project.scripts]
agent = "ui.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest-asyncio>=0.23",
    "pytest>=8.0",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true
